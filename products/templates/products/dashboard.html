<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Product Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">
            Product Management
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{% url 'dashboard' %}">
                Dashboard
            </a>

            {% comment %} <a class="nav-link" href="{% url 'product_list' %}">
                Products
            </a>

            <a class="nav-link" href="{% url 'product_create' %}">
                Add Product
            </a> {% endcomment %}

            <a class="nav-link" href="{% url 'logout' %}">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="mb-4">
        <h1>Dashboard</h1>
        <p class="text-muted">
            Overview of your products
        </p>
    </div>

    <div class="row g-4">

        <div class="col-md-6 col-lg-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h6 class="text-muted">Total Products</h6>
                    <h2>{{ total_products }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h6 class="text-muted">Active Products</h6>
                    <h2 class="text-success">{{ active_products }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h6 class="text-muted">Inactive Products</h6>
                    <h2 class="text-secondary">{{ inactive_products }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h6 class="text-muted">Low Stock</h6>
                    <h2 class="text-danger">{{ low_stock_products }}</h2>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
